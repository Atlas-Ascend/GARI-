name: Data or claim correction
description: Challenge a public fact, identity, amount, source, interpretation or correction record.
title: "Correction: "
labels: [correction]
body:
  - type: markdown
    attributes:
      value: |
        Do not submit client-level HMIS, medical, shelter-history, Social Security, domestic-violence location, confidential-source or privileged information.
  - type: input
    id: case
    attributes:
      label: Case ID
      placeholder: LSC-OR-CLATSOP-001
    validations:
      required: true
  - type: textarea
    id: challenged
    attributes:
      label: Exact statement or record challenged
      description: Quote the exact text or identify the exact entity, event or source ID.
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed correction
      description: State what should change and why.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Public supporting sources
      description: Provide public URLs, document titles, dates and page or section locations.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I have not included confidential or client-level personal information.
          required: true
