name: Command to Proof CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Test adversarial gates
        run: pytest -q

      - name: Generate JSON Schemas
        run: lantern generate-schema

      - name: Validate Clatsop shadow case
        run: lantern validate LSC-OR-CLATSOP-001

      - name: Compile allowlisted public data
        run: lantern build-public LSC-OR-CLATSOP-001

      - name: Verify public artifact exists
        run: test -s site/data/case.json

      - name: Scan generated site for prohibited keys
        run: |
          ! grep -RniE 'client_name|client_id|hmis_id|social_security_number|medical_record|diagnosis|date_of_birth|shelter_history' site

      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: lantern-genesis-proof
          path: |
            site/
            schemas/
          if-no-files-found: error
