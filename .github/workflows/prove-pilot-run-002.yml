name: Prove Pilot Run 002 Live

on:
  pull_request:
    paths:
      - ".github/workflows/prove-pilot-run-002.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - name: Prove published report
        run: |
          url='https://atlas-ascend.github.io/GARI-/pilot-run-002.html'
          for attempt in $(seq 1 18); do
            status=$(curl -L -sS -o /tmp/report.html -w '%{http_code}' "$url" || true)
            echo "attempt=$attempt status=$status"
            if [ "$status" = '200' ] \
              && grep -q 'Financial reconstruction' /tmp/report.html \
              && grep -q 'Outcome and monitoring reconstruction' /tmp/report.html \
              && grep -q 'Publication finding' /tmp/report.html \
              && grep -q '0</strong><span>misconduct findings' /tmp/report.html; then
              echo 'PILOT_RUN_002_LIVE_COMMAND_TO_PROOF_PASS'
              grep -o '<title>[^<]*</title>' /tmp/report.html || true
              exit 0
            fi
            sleep 10
          done
          echo 'PILOT_RUN_002_LIVE_COMMAND_TO_PROOF_FAIL'
          head -c 800 /tmp/report.html || true
          exit 1
