name: Temporary Build New Atlantis HOMEWARD APK
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    if: github.head_ref == 'build/new-atlantis-homeward-apk-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.1" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Pure Java homecoming proof
        working-directory: games/new-atlantis-homeward
        run: |
          rm -rf proof-classes && mkdir -p proof-classes
          javac -d proof-classes app/src/main/java/com/ghostatlas/homeward/Core.java proof/HomewardProof.java
          java -cp proof-classes com.ghostatlas.homeward.HomewardProof | tee HOMEWARD_RULE_PROOF.txt
          grep -q HOMEWARD_PROOF_OK HOMEWARD_RULE_PROOF.txt
      - name: Build native Android APK
        working-directory: games/new-atlantis-homeward
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify and name APK
        working-directory: games/new-atlantis-homeward
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose "$APK"
          sha256sum "$APK" | tee APK_SHA256.txt
          cp "$APK" Ghost-Atlas-NHCM5-New-Atlantis-HOMEWARD.apk
      - uses: actions/upload-artifact@v4
        with:
          name: New-Atlantis-HOMEWARD-APK
          path: |
            games/new-atlantis-homeward/Ghost-Atlas-NHCM5-New-Atlantis-HOMEWARD.apk
            games/new-atlantis-homeward/APK_SHA256.txt
            games/new-atlantis-homeward/HOMEWARD_RULE_PROOF.txt
          if-no-files-found: error
